<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽屉156集 · 人工审核</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#eef2f6;color:#1c2b3c}main{max-width:1180px;margin:24px auto;padding:0 20px}h1{font-size:26px;margin-bottom:6px}p{line-height:1.5}.muted{color:#627386;font-size:14px}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0}button,select,textarea{font:inherit;border:1px solid #c7d0db;border-radius:7px;background:white;padding:9px 13px}button{cursor:pointer}button:hover{background:#e8f0f8}button.active{background:#118e79;color:white}.viewer{background:#101820;border-radius:10px;padding:10px;display:flex;justify-content:center}video{display:block;width:100%;max-width:960px;max-height:62vh;aspect-ratio:640/362;background:#111}.panel{background:white;border-radius:10px;padding:18px;margin:16px 0}textarea{width:100%;min-height:90px;resize:vertical}#progress{margin-left:auto;font-weight:600}#frame{font-variant-numeric:tabular-nums}a{color:#175885}kbd{background:#e4eaf0;padding:2px 5px;border-radius:3px}#error{color:#b12626}.pass.active{background:#23754a}.issue.active{background:#a94332}label{display:block;margin-bottom:8px}
</style><main><h1>柜体位移 P90 ≤10px 批次 · 156集人工审核</h1><div class="muted">640×362审核副本 · 保留全部帧 / 30 FPS · 已剔除9个柜体不稳定源；保留78个原始源，每源两种时序</div><div class="bar"><button id="prev">← 上一集</button><select id="episode" aria-label="选择输出Episode"></select><button id="next">下一集 →</button><button id="pair">同源另一变体</button><button id="restored">下一条新恢复</button><span id="progress"></span></div><p id="meta"></p><p id="quality" class="muted"></p><div class="viewer"><video id="video" controls preload="metadata" playsinline></video></div><div class="bar"><span id="frame">帧 —</span><button id="backframe">退一帧</button><button id="forwardframe">进一帧</button><select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div><div class="panel"><div class="bar"><strong>你的审核结论</strong><button class="pass" data-status="pass">通过 [1]</button><button class="issue" data-status="issue">有问题 [2]</button><button data-status="unreviewed">待审核 [0]</button><button id="mark">把当前帧加入备注</button></div><label for="note">备注 / 问题帧</label><textarea id="note" placeholder="例如：第235帧，夹爪附近出现残影……"></textarea><div class="muted" id="saved">结论和备注仅保存在本机浏览器中，建议定期导出备份。</div></div><div class="bar"><button id="json">导出审核JSON</button><button id="csv">导出审核CSV</button><a href="episode-map.csv" download>下载Episode对应表</a><a href="excluded-sources.csv" download>剔除的原始源列表</a></div><p class="muted">快捷键：← / → 切集，空格播放/暂停，1通过，2有问题，0待审核。输出0–77为变体0，78–155为变体1；同源编号相差78。所有状态初始均为待审核，不预填自动检查结果。</p><p id="error" role="alert"></p></main><script>
'use strict';
const $=id=>document.getElementById(id),video=$('video'),select=$('episode'),note=$('note');const key='drawer-10px-review-156-20260912';let manifest,rows=[],records={},current=0;
const labels={unreviewed:'待审核',pass:'通过',issue:'有问题'},icons={unreviewed:'○',pass:'✓',issue:'!'};
function error(e){$('error').textContent=e.message||String(e);}
function record(){return records[current]||{status:'unreviewed',note:'',frame:0};}
function frame(){return Math.min(rows[current].frames-1,Math.max(0,Math.floor(video.currentTime*30+.0001)));}
function updateFrame(){if(rows.length)$('frame').textContent=`当前帧 ${frame()} / ${rows[current].frames-1} · ${video.currentTime.toFixed(3)}秒`;}
function refresh(){let pass=0,issue=0;for(const row of rows){let s=(records[row.output]||{}).status||'unreviewed';if(s==='pass')pass++;if(s==='issue')issue++;select.options[row.output].textContent=`${icons[s]} 输出 ${String(row.output).padStart(3,'0')} ${row.restored ? " · 新恢复" : ""} · 源${row.source} / 变体${row.variant}`;}$('progress').textContent=`已审 ${pass+issue}/156 · 通过 ${pass} · 有问题 ${issue}`;document.querySelectorAll('[data-status]').forEach(b=>b.classList.toggle('active',b.dataset.status===record().status));}
function save(status){let old=record();records[current]={status:status||old.status,note:note.value,frame:frame(),updated_at:new Date().toISOString()};try{localStorage.setItem(key,JSON.stringify(records));$('saved').textContent='已保存在本机浏览器 · '+new Date().toLocaleTimeString();}catch(e){error(e);}refresh();}
function load(n){video.pause();current=(n+156)%156;select.value=current;const row=rows[current];video.src=row.filename;video.playbackRate=+$('speed').value;note.value=record().note;$('meta').textContent=`输出 ${current} · 源 Episode ${row.source} · 变体 ${row.variant} · u=${row.position.toFixed(6)} · ${row.frames}帧 / ${(row.frames/30).toFixed(2)}秒`;$('quality').textContent=(row.quality_notes||[]).length?'复核提示：'+row.quality_notes.join(' '):'';refresh();}
$('restored').onclick=()=>{for(let step=1;step<=rows.length;step++){const n=(current+step)%rows.length;if(rows[n].restored){load(n);return;}}};$('prev').onclick=()=>load(current-1);$('next').onclick=()=>load(current+1);$('pair').onclick=()=>load(current<78?current+78:current-78);select.onchange=()=>load(+select.value);note.oninput=()=>save();document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>save(b.dataset.status));video.ontimeupdate=updateFrame;video.onloadedmetadata=()=>{video.playbackRate=+$('speed').value;updateFrame();};video.onerror=()=>error(new Error('无法播放 '+rows[current]?.filename));$('speed').onchange=()=>video.playbackRate=+$('speed').value;
function step(d){video.pause();video.currentTime=Math.min(rows[current].frames-1,Math.max(0,frame()+d))/30;updateFrame();}$('backframe').onclick=()=>step(-1);$('forwardframe').onclick=()=>step(1);$('mark').onclick=()=>{note.value+=(note.value?'\n':'')+`帧 ${frame()}（${video.currentTime.toFixed(3)}秒）：`;save();note.focus();};
function result(){return rows.map(r=>({...r,...(records[r.output]||{status:'unreviewed',note:'',frame:0})}));}
function download(name,text,type){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
$('json').onclick=()=>download('drawer-10px-review-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({exported_at:new Date().toISOString(),source_dataset:manifest.source_dataset,reviews:result()},null,2),'application/json');$('csv').onclick=()=>{let columns=['output','source','variant','position','status','frame','note','updated_at'],quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';let lines=[columns.map(quote).join(','),...result().map(r=>columns.map(k=>quote(r[k])).join(','))];download('drawer-10px-review.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();load(current-1);}if(e.key==='ArrowRight'){e.preventDefault();load(current+1);}if(e.code==='Space'){e.preventDefault();video.paused?video.play():video.pause();}if(['0','1','2'].includes(e.key))save({'0':'unreviewed','1':'pass','2':'issue'}[e.key]);});
(async()=>{manifest=await(await fetch('manifest.json')).json();rows=manifest.episodes_data;const saved=localStorage.getItem(key);if(saved)records=JSON.parse(saved);for(const row of rows)select.add(new Option('',row.output));load(0);})().catch(error);
</script></html>
